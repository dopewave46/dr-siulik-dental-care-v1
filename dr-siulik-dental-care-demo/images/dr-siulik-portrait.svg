<svg viewBox="0 0 480 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated portrait of Dr. Siulik, Chief Dental Surgeon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6fb"/>
      <stop offset="1" stop-color="#bfeae3"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf6f6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123354"/>
      <stop offset="1" stop-color="#0a2540"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#79e8dc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#79e8dc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="600" fill="url(#bg)"/>
  <circle cx="248" cy="190" r="230" fill="url(#glow)"/>

  <!-- shoulders / coat -->
  <path d="M60 600c8-96 78-168 188-168s180 72 188 168z" fill="url(#coat)" stroke="#dce9f0" stroke-width="2"/>
  <path d="M60 600c8-96 78-168 188-168s180 72 188 168" fill="none" stroke="#0d7377" stroke-width="4" stroke-linecap="round" opacity=".18"/>

  <!-- collar -->
  <path d="M198 438c14 18 30 26 50 26s36-8 50-26l-14 58c-12 8-24 12-36 12s-24-4-36-12z" fill="#0d7377"/>
  <path d="M198 438c14 18 30 26 50 26s36-8 50-26" fill="none" stroke="#0a2540" stroke-width="2" opacity=".15"/>

  <!-- neck -->
  <rect x="216" y="392" width="64" height="64" rx="20" fill="#e7b895"/>

  <!-- head -->
  <ellipse cx="248" cy="300" rx="98" ry="106" fill="#f0c9a4"/>

  <!-- ears -->
  <ellipse cx="150" cy="308" rx="14" ry="20" fill="#f0c9a4"/>
  <ellipse cx="346" cy="308" rx="14" ry="20" fill="#f0c9a4"/>

  <!-- hair -->
  <path d="M150 268c-6-84 44-140 98-140s104 56 98 140c0-4-14-30-36-38-8 22-24 30-40 30-4-16-14-24-22-24s-18 8-22 24c-16 0-32-8-40-30-22 8-36 34-36 38z" fill="url(#hair)"/>
  <path d="M152 232c10-18 30-30 46-32-10 10-18 26-18 44" fill="none" stroke="#061a2e" stroke-width="3" opacity=".2" stroke-linecap="round"/>

  <!-- eyebrows -->
  <path d="M204 288c10-8 24-10 34-6" fill="none" stroke="#0a2540" stroke-width="5" stroke-linecap="round"/>
  <path d="M258 282c10-4 24-2 34 6" fill="none" stroke="#0a2540" stroke-width="5" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="219" cy="306" rx="7" ry="8" fill="#0a2540"/>
  <ellipse cx="277" cy="306" rx="7" ry="8" fill="#0a2540"/>

  <!-- nose -->
  <path d="M245 300c-2 14-8 24-8 30 4 6 12 8 18 6" fill="none" stroke="#d9a97e" stroke-width="4" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M212 344c14 16 42 16 56 0" fill="none" stroke="#0a2540" stroke-width="5" stroke-linecap="round"/>
  <path d="M224 352c8 6 24 6 32 0" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="196" cy="330" rx="14" ry="9" fill="#e9a06e" opacity=".28"/>
  <ellipse cx="300" cy="330" rx="14" ry="9" fill="#e9a06e" opacity=".28"/>

  <!-- badge on coat -->
  <circle cx="200" cy="500" r="16" fill="#0d7377"/>
  <path d="M200 492c-3 0-4 1.4-5.7 1.4-1.4 0-2-1-2.6.9-.4 1.4.5 2 .7 3.6.2 1.2.5 3.4 1.3 3.4.6 0 .5-1.6.9-2.4.2-.5.4-.7.9-.7s.7.2.9.7c.4.8.3 2.4.9 2.4.8 0 1.1-2.2 1.3-3.4.2-1.6 1.1-2.2.7-3.6-.4-1.2-1.2-.2-2.6-.2-.6 0-1.2-1.1-2.7-1.1Z" fill="#fff"/>
</svg>
